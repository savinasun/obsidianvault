<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="Helvetica, Arial, sans-serif">
<rect width="940" height="470" fill="#ffffff"/>
<text x="470.0" y="36.0" font-size="21" fill="#222" text-anchor="middle" font-style="normal" font-weight="bold">AX = XB: one rigid gripper–camera rig seen at two stations</text>
<text x="470.0" y="58.0" font-size="13" fill="#555" text-anchor="middle" font-style="normal" font-weight="normal">arrow a → b is the transform T<tspan baseline-shift="sub" font-size="10">ab</tspan> (pose of frame b in frame a); both paths from g<tspan baseline-shift="sub" font-size="10">j</tspan> to c<tspan baseline-shift="sub" font-size="10">i</tspan> compose to the same pose</text>
<rect x="70.0" y="120.0" width="160.0" height="60.0" rx="10" fill="#ffffff" stroke="#2ca02c" stroke-width="2.2"/>
<text x="150.0" y="146.0" font-size="17" fill="#2ca02c" text-anchor="middle" font-style="normal" font-weight="bold">g<tspan baseline-shift="sub" font-size="12">j</tspan></text>
<text x="150.0" y="167.0" font-size="12.5" fill="#555" text-anchor="middle" font-style="normal" font-weight="normal">gripper at station j</text>
<rect x="460.0" y="120.0" width="160.0" height="60.0" rx="10" fill="#ffffff" stroke="#2ca02c" stroke-width="2.2"/>
<text x="540.0" y="146.0" font-size="17" fill="#2ca02c" text-anchor="middle" font-style="normal" font-weight="bold">g<tspan baseline-shift="sub" font-size="12">i</tspan></text>
<text x="540.0" y="167.0" font-size="12.5" fill="#555" text-anchor="middle" font-style="normal" font-weight="normal">gripper at station i</text>
<rect x="70.0" y="330.0" width="160.0" height="60.0" rx="10" fill="#ffffff" stroke="#1f77b4" stroke-width="2.2"/>
<text x="150.0" y="356.0" font-size="17" fill="#1f77b4" text-anchor="middle" font-style="normal" font-weight="bold">c<tspan baseline-shift="sub" font-size="12">j</tspan></text>
<text x="150.0" y="377.0" font-size="12.5" fill="#555" text-anchor="middle" font-style="normal" font-weight="normal">camera at station j</text>
<rect x="460.0" y="330.0" width="160.0" height="60.0" rx="10" fill="#ffffff" stroke="#1f77b4" stroke-width="2.2"/>
<text x="540.0" y="356.0" font-size="17" fill="#1f77b4" text-anchor="middle" font-style="normal" font-weight="bold">c<tspan baseline-shift="sub" font-size="12">i</tspan></text>
<text x="540.0" y="377.0" font-size="12.5" fill="#555" text-anchor="middle" font-style="normal" font-weight="normal">camera at station i</text>
<line x1="232.0" y1="150.0" x2="448.8" y2="150.0" stroke="#2ca02c" stroke-width="3" opacity="1.0" stroke-linecap="butt"/>
<polygon points="456.0,150.0 444.9,154.7 444.9,145.3" fill="#2ca02c"/>
<text x="345.0" y="128.0" font-size="14.5" fill="#2ca02c" text-anchor="middle" font-style="normal" font-weight="bold">A = (T<tspan baseline-shift="sub" font-size="11">bg</tspan><tspan baseline-shift="super" font-size="11">(j)</tspan>)<tspan baseline-shift="super" font-size="11">−1</tspan> T<tspan baseline-shift="sub" font-size="11">bg</tspan><tspan baseline-shift="super" font-size="11">(i)</tspan></text>
<text x="345.0" y="178.0" font-size="12.5" fill="#2ca02c" text-anchor="middle" font-style="normal" font-weight="normal">gripper motion — forward kinematics</text>
<line x1="232.0" y1="360.0" x2="448.8" y2="360.0" stroke="#1f77b4" stroke-width="3" opacity="1.0" stroke-linecap="butt"/>
<polygon points="456.0,360.0 444.9,364.7 444.9,355.3" fill="#1f77b4"/>
<text x="345.0" y="340.0" font-size="14.5" fill="#1f77b4" text-anchor="middle" font-style="normal" font-weight="bold">B = T<tspan baseline-shift="sub" font-size="11">ct</tspan><tspan baseline-shift="super" font-size="11">(j)</tspan> (T<tspan baseline-shift="sub" font-size="11">ct</tspan><tspan baseline-shift="super" font-size="11">(i)</tspan>)<tspan baseline-shift="super" font-size="11">−1</tspan></text>
<text x="345.0" y="390.0" font-size="12.5" fill="#1f77b4" text-anchor="middle" font-style="normal" font-weight="normal">camera motion — PnP on target</text>
<line x1="150.0" y1="182.0" x2="150.0" y2="318.8" stroke="#d62728" stroke-width="3" opacity="1.0" stroke-linecap="butt"/>
<polygon points="150.0,326.0 145.3,314.9 154.7,314.9" fill="#d62728"/>
<line x1="540.0" y1="182.0" x2="540.0" y2="318.8" stroke="#d62728" stroke-width="3" opacity="1.0" stroke-linecap="butt"/>
<polygon points="540.0,326.0 535.3,314.9 544.7,314.9" fill="#d62728"/>
<text x="136.0" y="262.0" font-size="15" fill="#d62728" text-anchor="end" font-style="normal" font-weight="bold">X = T<tspan baseline-shift="sub" font-size="11">gc</tspan></text>
<text x="554.0" y="262.0" font-size="15" fill="#d62728" text-anchor="start" font-style="normal" font-weight="bold">X = T<tspan baseline-shift="sub" font-size="11">gc</tspan></text>
<line x1="210.0" y1="182.0" x2="474.7" y2="325.1" stroke="#6a51a3" stroke-width="1.8" stroke-dasharray="6,5" opacity="1.0" stroke-linecap="butt"/>
<polygon points="480.0,328.0 470.0,327.0 473.8,320.2" fill="#6a51a3"/>
<text x="258.0" y="252.0" font-size="14" fill="#6a51a3" text-anchor="middle" font-style="normal" font-weight="bold">AX = XB</text>
<rect x="660.0" y="92.0" width="260.0" height="336.0" rx="8" fill="#f7f7f7" stroke="#ddd" stroke-width="1"/>
<text x="676.0" y="120.0" font-size="16" fill="#222" text-anchor="start" font-style="normal" font-weight="bold">Consequences</text>
<text x="676.0" y="150.0" font-size="14" fill="#222" text-anchor="start" font-style="normal" font-weight="bold">R<tspan baseline-shift="sub" font-size="11">A</tspan> = R<tspan baseline-shift="sub" font-size="11">X</tspan> R<tspan baseline-shift="sub" font-size="11">B</tspan> R<tspan baseline-shift="sub" font-size="11">X</tspan><tspan baseline-shift="super" font-size="11">⊤</tspan></text>
<text x="676.0" y="173.0" font-size="14" fill="#222" text-anchor="start" font-style="normal" font-weight="normal">A and B are conjugate, so:</text>
<text x="676.0" y="196.0" font-size="14" fill="#222" text-anchor="start" font-style="normal" font-weight="normal">• equal angles  θ<tspan baseline-shift="sub" font-size="11">A</tspan> = θ<tspan baseline-shift="sub" font-size="11">B</tspan></text>
<text x="676.0" y="219.0" font-size="14" fill="#222" text-anchor="start" font-style="normal" font-weight="normal">• axes  n<tspan baseline-shift="sub" font-size="11">A</tspan> = R<tspan baseline-shift="sub" font-size="11">X</tspan> n<tspan baseline-shift="sub" font-size="11">B</tspan></text>
<text x="676.0" y="242.0" font-size="14" fill="#222" text-anchor="start" font-style="normal" font-weight="normal">• equal slides  n<tspan baseline-shift="sub" font-size="11">A</tspan>·t<tspan baseline-shift="sub" font-size="11">A</tspan> = n<tspan baseline-shift="sub" font-size="11">B</tspan>·t<tspan baseline-shift="sub" font-size="11">B</tspan></text>
<text x="676.0" y="288.0" font-size="14" fill="#222" text-anchor="start" font-style="normal" font-weight="bold">One motion pair fixes X only</text>
<text x="676.0" y="311.0" font-size="14" fill="#222" text-anchor="start" font-style="normal" font-weight="normal">up to a 2-dof family:</text>
<text x="676.0" y="334.0" font-size="14" fill="#222" text-anchor="start" font-style="normal" font-weight="normal">rotation about n<tspan baseline-shift="sub" font-size="11">A</tspan> and</text>
<text x="676.0" y="357.0" font-size="14" fill="#222" text-anchor="start" font-style="normal" font-weight="normal">translation along n<tspan baseline-shift="sub" font-size="11">A</tspan>.</text>
<text x="676.0" y="380.0" font-size="14" fill="#d62728" text-anchor="start" font-style="normal" font-weight="bold">Two pairs with non-parallel</text>
<text x="676.0" y="403.0" font-size="14" fill="#d62728" text-anchor="start" font-style="normal" font-weight="bold">axes make X unique.</text>
</svg>