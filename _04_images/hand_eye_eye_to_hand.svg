<text x="76.0" y="106.0" font-size="15" fill="#222" text-anchor="start" font-style="normal" font-weight="normal">every pose i:  X T<tspan baseline-shift="sub" font-size="11">ct</tspan><tspan baseline-shift="super" font-size="11">(i)</tspan> = T<tspan baseline-shift="sub" font-size="11">bg</tspan><tspan baseline-shift="super" font-size="11">(i)</tspan> T<tspan baseline-shift="sub" font-size="11">gt</tspan></text>
<text x="76.0" y="134.0" font-size="15" fill="#222" text-anchor="start" font-style="normal" font-weight="normal">A = T<tspan baseline-shift="sub" font-size="11">bg</tspan><tspan baseline-shift="super" font-size="11">(j)</tspan> (T<tspan baseline-shift="sub" font-size="11">bg</tspan><tspan baseline-shift="super" font-size="11">(i)</tspan>)<tspan baseline-shift="super" font-size="11">−1</tspan>,   B = T<tspan baseline-shift="sub" font-size="11">ct</tspan><tspan baseline-shift="super" font-size="11">(j)</tspan> (T<tspan baseline-shift="sub" font-size="11">ct</tspan><tspan baseline-shift="super" font-size="11">(i)</tspan>)<tspan baseline-shift="super" font-size="11">−1</tspan></text>
<text x="76.0" y="166.0" font-size="18" fill="#6a51a3" text-anchor="start" font-style="normal" font-weight="bold">⇒  A X = X B</text>
