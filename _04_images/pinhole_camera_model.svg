<text x="410.0" y="168.0" font-size="14" fill="#3182bd" text-anchor="middle" font-style="normal" font-weight="bold">intrinsics K:  fₓ, f<tspan baseline-shift="sub" font-size="10">y</tspan>, cₓ, c<tspan baseline-shift="sub" font-size="10">y</tspan>, s</text>
